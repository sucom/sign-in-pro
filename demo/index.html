<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign in - Demo Budget Management</title>
  <link rel="stylesheet" href="css/style.css">
  <script>
    (function () {
      const savedTheme = localStorage.getItem('demoTheme') || 'dark';
      document.documentElement.setAttribute('data-theme', savedTheme);
    })();
  </script>
</head>
<body>
  <div class="theme-toggle-wrapper">
    <button type="button" class="theme-toggle-switch" id="themeToggleBtn" role="switch" aria-checked="true" aria-label="Toggle dark/light theme" title="Toggle dark/light theme">
      <span class="theme-track-icon sun" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="4"></circle>
          <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"></path>
        </svg>
      </span>
      <span class="theme-track-icon moon" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"></path>
        </svg>
      </span>
      <span class="theme-toggle-thumb">
        <span class="theme-thumb-icon sun" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="4"></circle>
            <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"></path>
          </svg>
        </span>
        <span class="theme-thumb-icon moon" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"></path>
          </svg>
        </span>
      </span>
    </button>
  </div>
  <div class="login-page">
    <div class="login-header">
      <h1><span class="demo-text">Demo</span><br>Budget Management</h1>
    </div>

    <div class="login-card">
      <h2>Sign in</h2>
      <p class="subtitle">Please enter your credentials to access your account</p>

      <!-- Step 1 -->
      <div id="step-1">
        <div class="form-group" id="email-form-group">
          <label for="work-email">Work email <span class="req">*</span></label>
          <input type="text" id="work-email" class="form-control" placeholder="Enter your work email here">
          <div class="error-message" id="email-error-msg">Please enter an email address</div>
        </div>

        <button type="button" class="btn btn-primary" id="next-btn">Next</button>

        <button type="button" class="btn btn-outline">
          <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/><path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/><path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/><path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/></svg>
          Sign In with Google
        </button>

        <div class="login-footer">
          <div>New to Demo Budget Management?</div>
          <div><a href="#">Schedule a demo</a></div>
        </div>
      </div>

      <!-- Step 2 -->
      <div id="step-2">
        <div class="form-group">
          <label>Work email <span class="req">*</span></label>
          <div class="readonly-email-box">
            <span id="display-email"></span>
            <button type="button" id="change-email-btn">Change</button>
          </div>
        </div>

        <div class="form-group" id="password-form-group">
          <label for="work-password">Password <span class="req">*</span></label>
          <a href="#" class="forgot-link">Forgot password?</a>
          <div class="password-input-wrapper">
            <input type="password" id="work-password" class="form-control" placeholder="Enter your password here">
            <button type="button" class="toggle-pwd" id="toggle-pwd">
              <svg fill="none" stroke="currentColor" viewBox="0 0 24 24" width="20" height="20"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M9.88 9.88l-3.29-3.29m7.532 7.532l3.29 3.29M3 3l3.59 3.59m0 0A9.953 9.953 0 0112 5c4.478 0 8.268 2.943 9.543 7a10.025 10.025 0 01-4.132 5.411m0 0L21 21"></path></svg>
            </button>
          </div>
          <div class="error-message" id="password-error-msg">Please enter your password</div>
        </div>

        <button type="button" class="btn btn-primary" id="signin-btn">Sign In</button>

        <button type="button" class="btn btn-outline">
          <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/><path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/><path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/><path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/></svg>
          Sign In with Google
        </button>

        <div class="login-footer">
          <div>New to Demo Budget Management?</div>
          <div><a href="#">Schedule a demo</a></div>
        </div>
      </div>
    </div>
  </div>
  <script src="js/app.js"></script>
</body>
</html>
